global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 1.0
  width: 20.0
  height: 20.0
  resolution: 0.05
  rolling_window: false       # Global costmap does not scroll with the robot
  static_map: false
  transform_tolerance: 1.0

  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    observation_sources: laser_scan_sensor
    laser_scan_sensor:
      data_type: LaserScan
      topic: scan
      marking: true
      clearing: true

  inflation_layer:
    inflation_radius: 0.5
