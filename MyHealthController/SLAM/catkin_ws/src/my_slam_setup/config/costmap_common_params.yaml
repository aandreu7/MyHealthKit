robot_radius: 0.20 # Measure the full swept outline; this is a provisional value.
footprint_padding: 0.02
transform_tolerance: 0.3
resolution: 0.05
obstacle_layer:
  enabled: true
  observation_sources: laser
  obstacle_range: 8.0
  raytrace_range: 10.0
  track_unknown_space: true
  laser:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    expected_update_rate: 0.5
    observation_persistence: 0.0
    inf_is_valid: false
inflation_layer:
  enabled: true
  inflation_radius: 0.45
  cost_scaling_factor: 5.0
