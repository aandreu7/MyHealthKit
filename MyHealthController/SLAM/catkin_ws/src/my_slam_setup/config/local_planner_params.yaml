DWAPlannerROS:
  odom_topic: /odom
  max_vel_x: 0.15
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.15
  min_vel_trans: 0.02
  max_vel_theta: 0.4
  min_vel_theta: 0.10
  acc_lim_x: 0.2
  acc_lim_y: 0.0
  acc_lim_theta: 0.5
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.20
  latch_xy_goal_tolerance: true
  trans_stopped_vel: 0.03
  theta_stopped_vel: 0.05
  sim_time: 2.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 10
  vy_samples: 1
  vth_samples: 20
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05
  stop_time_buffer: 0.3
  oscillation_reset_dist: 0.05
