# Common configuration for both global and local costmaps

obstacle_range: 2.5         # Distance in meters up to which obstacles are considered
raytrace_range: 3.0         # Distance up to which free space is cleared using ray tracing

# Robot footprint: circular approximation
robot_radius: 0.2           # Radius of the robot (in meters). You can use footprint instead.

# Costmap plugins (sensors and obstacle sources)
observation_sources: laser_scan_sensor

laser_scan_sensor:
  data_type: LaserScan
  topic: scan                # Topic published by RPLIDAR
  marking: true              # Mark occupied cells (obstacles)
  clearing: true             # Clear free space (using ray tracing)
